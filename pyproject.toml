[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shrinkflation-data"
version = "0.1.0"
description = "Evidence-preserving UK grocery data preparation"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4,<2", "requests>=2.32,<3"]

[project.optional-dependencies]
models = [
    "numpy>=2.3,<3", "pandas>=2.3,<4", "scikit-learn>=1.7,<2",
    "joblib>=1.5,<2", "pyarrow>=21,<24", "matplotlib>=3.10,<4",
]

[project.scripts]
shrink-data = "shrinkflation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
